name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove Wi-Fi passwords, network names, BSSIDs, and other private details from screenshots and logs.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
